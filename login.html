
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXORA TECH | Login</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#080b18;
  color:white;
  font-family:Arial,sans-serif;
}

.login-box{
  width:90%;
  max-width:420px;
  background:#12182b;
  border:1px solid #6d4aff;
  border-radius:18px;
  padding:30px;
  box-shadow:0 0 30px rgba(109,74,255,.15);
}

h1{
  text-align:center;
  color:#a78bfa;
}

.subtitle{
  text-align:center;
  color:#aab1c9;
  margin-bottom:25px;
}

input{
  width:100%;
  padding:14px;
  margin:10px 0;
  background:#090e20;
  color:white;
  border:1px solid #303957;
  border-radius:8px;
}

button{
  width:100%;
  padding:14px;
  background:#7654ff;
  color:white;
  border:0;
  border-radius:8px;
  margin-top:15px;
  cursor:pointer;
  font-weight:bold;
}

button:disabled{
  opacity:.6;
  cursor:wait;
}

#message{
  margin-top:15px;
  text-align:center;
  font-size:14px;
  overflow-wrap:anywhere;
}

</style>
</head>

<body>

<div class="login-box">
<h1>NEXORA TECH</h1>
<p class="subtitle">Secure Member Portal</p>

<form id="loginForm">
<input
  id="email"
  type="email"
  placeholder="Email address"
  required
>

<input
  id="password"
  type="password"
  placeholder="Password"
  required
>

<button id="loginButton" type="submit">
Login
</button>
</form>

<div id="message"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://nowfrggtbfwcqlobgjkh.supabase.co/rest/v1/";
const SUPABASE_KEY = "sb_publishable_rCCqm5vJvTtt9OAKgzqLEQ_4k30UgG0";

const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const form = document.getElementById("loginForm");
const button = document.getElementById("loginButton");
const message = document.getElementById("message");

form.addEventListener("submit", async function(event){
  event.preventDefault();

  message.textContent = "";
  button.disabled = true;
  button.textContent = "Signing in...";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  try{
    const {data,error} = await client.auth.signInWithPassword({
      email:email,
      password:password
    });

    if(error) throw error;

    message.textContent = "Login successful! Redirecting...";

    window.location.href = "dashboard.html";

  }catch(error){
    message.textContent = error.message;
    button.disabled = false;
    button.textContent = "Login";
  }
});
</script>

</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXORA TECH | Member Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: #ffffff;
  background:
    radial-gradient(circle at top left, #22205a, transparent 45%),
    linear-gradient(135deg, #080b17, #10172b, #080b17);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.login-container {
  width: 100%;
  max-width: 430px;
  background: rgba(14, 19, 38, 0.96);
  border: 1px solid #313c65;
  border-radius: 18px;
  padding: 38px;
  box-shadow: 0 0 45px rgba(124, 58, 237, 0.15);
}

.logo {
  text-align: center;
  font-size: 29px;
  font-weight: 800;
  letter-spacing: 4px;
  color: #a78bfa;
}

.tagline {
  text-align: center;
  color: #94a3b8;
  margin-top: 10px;
  font-size: 13px;
}

.portal-title {
  text-align: center;
  margin-top: 35px;
  font-size: 23px;
}

.portal-description {
  text-align: center;
  color: #94a3b8;
  font-size: 14px;
  margin-top: 10px;
  margin-bottom: 25px;
}

label {
  display: block;
  margin: 18px 0 8px;
  font-size: 14px;
  color: #dbe4f3;
}

input {
  width: 100%;
  padding: 14px;
  background: #090e1d;
  color: white;
  border: 1px solid #374151;
  border-radius: 9px;
  outline: none;
}

input:focus {
  border-color: #8b5cf6;
  box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.15);
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 24px;
  border: none;
  border-radius: 9px;
  color: white;
  font-weight: bold;
  background: linear-gradient(90deg, #6d28d9, #9333ea);
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  filter: brightness(1.15);
}

button:disabled {
  opacity: 0.6;
  cursor: wait;
}

.message {
  margin-top: 16px;
  text-align: center;
  font-size: 13px;
  overflow-wrap: anywhere;
}

.footer {
  margin-top: 28px;
  text-align: center;
  color: #64748b;
  font-size: 12px;
}

.back-link {
  display: block;
  margin-top: 20px;
  text-align: center;
  color: #a78bfa;
  text-decoration: none;
  font-size: 13px;
}

.back-link:hover {
  text-decoration: underline;
}

</style>
</head>

<body>

<div class="login-container">

  <div class="logo">NEXORA TECH</div>

  <div class="tagline">
    Building Smarter Discord Communities
  </div>

  <h1 class="portal-title">Member Login</h1>

  <p class="portal-description">
    Sign in to access your NEXORA TECH account.
  </p>

  <form id="loginForm">

    <label for="email">Email Address</label>
    <input
      id="email"
      type="email"
      placeholder="Enter your email"
      autocomplete="email"
      required
    >

    <label for="password">Password</label>
    <input
      id="password"
      type="password"
      placeholder="Enter your password"
      autocomplete="current-password"
      required
    >

    <button id="loginButton" type="submit">
      Sign In
    </button>

    <div id="message" class="message"></div>

  </form>

  <a class="back-link" href="index.html">
    ← Back to NEXORA TECH
  </a>

  <div class="footer">
    NEXORA TECH · Secure Account Access
  </div>

</div>

<script>
const SUPABASE_URL = "https://nowfrggtbfwcqlobgjkh.supabase.co/rest/v1/";
const SUPABASE_KEY = "sb_publishable_rCCqm5vJvTtt9OAKgzqLEQ_4k30UgG0";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const button = document.getElementById("loginButton");

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  message.textContent = "";
  button.disabled = true;
  button.textContent = "Authenticating...";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  try {
    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

    if (error) {
      message.textContent = "Login failed. Check your email and password.";
      return;
    }

    message.style.color = "#86efac";
    message.textContent = "Login successful!";

    window.location.href = "dashboard.html";

  } catch (err) {
    message.textContent = "Unable to connect. Please try again.";
  } finally {
    button.disabled = false;
    button.textContent = "Sign In";
  }
});
</script>

</body>
</html>
